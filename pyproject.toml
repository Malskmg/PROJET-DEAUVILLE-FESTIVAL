[project]
name = "deauville-festival"
version = "0.1.0"
description = "Festival management platform for Deauville Festival du Rire 2027"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/festival"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/streamlit_app",
    "/tests",
    "/data/festival.json",
    "/web",
    "/.streamlit/config.toml",
    "/scripts",
    "/main.py",
    "/README.md",
    "/API.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
]
